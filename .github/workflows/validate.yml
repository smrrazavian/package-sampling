name: validate

# The high-N statistical battery (ADR-0005). Minutes, not seconds, so it runs
# nightly and before a release rather than on every push.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov
      - name: Full battery, slow layers included
        run: pytest
